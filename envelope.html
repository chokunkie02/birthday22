<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เทมเพลตซองจดหมาย</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;700&family=Mali:wght@400;500;600&family=Caveat:wght@500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet" href="scrapbook.css">
    <script src="scrapbook.js"></script>
    <style>
        
        body {
            font-family: 'Kanit', sans-serif;
            overflow: hidden;
            background-color: var(--bg-color);
        }
        
        .view {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* --- Envelope Design --- */
        .envelope-wrapper {
            perspective: 1000px;
            position: relative;
            z-index: 5;   /* อยู่เหนือสติกเกอร์ */
            /* ซองลอยเบาๆ ชวนให้แตะ */
            animation: env-idle 4.5s ease-in-out infinite;
        }
        .envelope-wrapper.is-open { animation: none; }
        @keyframes env-idle {
            0%, 100% { transform: translateY(0) rotate(-1.5deg); }
            50% { transform: translateY(-6px) rotate(0.5deg); }
        }
        .envelope {
            position: relative;
            width: 300px;
            height: 200px;
            cursor: pointer;
            transition: transform 0.5s;
            filter: drop-shadow(0 8px 10px var(--shadow-color));
            -webkit-tap-highlight-color: transparent;
        }
        @media (hover: hover) {
            .envelope:hover { transform: translateY(-8px) scale(1.02); }
        }
        .envelope:active { transform: scale(0.97); }
        @media (max-width: 340px) {
            .envelope-wrapper { zoom: 0.9; }
        }
        @media (prefers-reduced-motion: reduce) {
            .envelope-wrapper { animation: none; }
        }
        .envelope.open .top-flap {
            transform: rotateX(180deg);
        }
       
        /* Envelope Parts */
        .envelope .flap {
            position: absolute;
        }
        .envelope .left-flap {
            top: 0; left: 0; width: 155px; height: 200px;
            background: #F1E5D5;   /* กระดาษคราฟต์อ่อน */
            clip-path: polygon(100% 0, 0 50%, 100% 100%);
            z-index: 4;   /* ฝาซองด้านหน้า = กระเป๋า (บังจดหมาย) */
        }
        .envelope .right-flap {
            top: 0; right: 0; width: 155px; height: 200px;
            background: #EDDFCC;
            clip-path: polygon(0 0, 100% 50%, 0 100%);
            z-index: 4;   /* ฝาซองด้านหน้า = กระเป๋า (บังจดหมาย) */
        }
        .envelope .bottom-flap {
            bottom: 0; left: 0; width: 300px; height: 105px;
            background: #F4EADD;
            clip-path: polygon(0 100%, 100% 100%, 50% 0);
            top: auto;
            z-index: 4;   /* ฝาซองด้านหน้า = กระเป๋า (บังจดหมาย) */
        }
        .envelope .top-flap {
            top: 0; left: 0; width: 100%; height: 105px;
            background: #E8D6BF;
            clip-path: polygon(0 0, 100% 0, 50% 100%);
            transform-origin: top;
            transition: transform 0.8s ease-in-out;
            z-index: 5;
        }
        .envelope .front-panel {
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #F6EEE3;
            border-radius: 6px;
            z-index: 1;
        }
        /* ตราประทับขี้ผึ้ง */
        .envelope .seal {
            position: absolute;
            top: 84px;
            left: 50%;
            transform: translateX(-50%) rotate(-8deg);
            width: 40px;
            height: 40px;
            background: var(--accent-color);
            border-radius: 47% 53% 50% 50% / 52% 48% 52% 48%;
            box-shadow: inset 0 0 0 4px rgba(255,255,255,.18), 0 2px 3px var(--shadow-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            z-index: 6;
            transition: opacity 0.5s;
        }
        .envelope .env-tape {
            top: -9px;
            left: auto;
            right: -18px;
            margin: 0;
            width: 64px;
            transform: rotate(32deg);
            z-index: 7;
            transition: opacity .4s;
        }
        .envelope.open .env-tape { opacity: 0; }

        .env-instruction {
            position: relative;
            z-index: 5;
            margin-top: 40px;
            color: var(--heading-color);
            font-size: 18px;
            transition: opacity .5s;
        }
        .env-instruction small { display: block; font-size: 14px; color: var(--accent-color); }

        /* --- เนื้อหาจดหมาย (ลายมือ วางตามเส้นบรรทัด) --- */
        .letter-title {
            color: var(--heading-color);
            font-size: 34px;
            line-height: 1.1;
            margin: 6px 0 10px;
        }
        #letter-content { font-family: 'Mali', 'Kanit', sans-serif; }
        #letter-content p.letter-part {
            font-size: 16px;
            line-height: 32px;
            color: var(--text-color);
        }
        .envelope.open .seal {
            opacity: 0;
        }

        /* --- Letter Inside Envelope --- */
        .letter-inside { scrollbar-width: none; }               /* ยังเลื่อนด้วยนิ้วได้ แค่ซ่อนแถบ */
        .letter-inside::-webkit-scrollbar { display: none; }
        .letter-inside {
            position: absolute;
            width: 260px;
            height: 180px;
            top: 15px;
            left: 20px;
            /* กระดาษจดหมายมีเส้นบรรทัด */
            background-color: var(--paper-color);
            background-image: repeating-linear-gradient(to bottom, transparent 0 31px, var(--paper-line) 31px 32px);
            background-position: 0 14px;
            border: 1px solid var(--paper-line);
            border-radius: 4px;
            box-shadow: 0 10px 24px -12px var(--shadow-color);
            z-index: 3;
            transform: translateY(0) scale(0.85);
            transition: none;
            padding: 22px 20px 84px;
            -webkit-overflow-scrolling: touch;
            box-sizing: border-box;
            opacity: 0;
            /* เพิ่มเพื่อให้เลื่อนเนื้อหาได้ */
            overflow-y: auto;
        }

        /* Letter animations */
        @keyframes letter-slide-out {
            0% { 
                transform: translateY(0) scale(0.85);
                opacity: 0;
            }
            30% { 
                opacity: 0.7;
            }
            70% { 
                transform: translateY(-150px) scale(0.85);
                opacity: 0.9;
            }
            100% { 
                transform: translateY(-200px) scale(0.85);
                opacity: 1;
            }
        }

        @keyframes letter-expand-center {
            0% { 
                transform: translateY(-200px) scale(0.85);
                opacity: 1;
            }
            100% { 
                transform: translate(-50%, -40%) scale(1.2);
                left: 50%;
                top: 60%;
                width: 400px;
                height: 500px;
                z-index: 10;
                opacity: 1;
            }
        }

        @keyframes letter-shrink-back {
            0% { 
                transform: translate(-50%, -40%) scale(1.2);
                left: 50%;
                top: 60%;
                width: 400px;
                height: 500px;
                z-index: 10;
                opacity: 1;
            }
            100% { 
                transform: translateY(-200px) scale(0.85);
                left: 20px;
                top: 15px;
                width: 260px;
                height: 180px;
                z-index: 4;
                opacity: 1;
            }
        }

        @keyframes letter-slide-in {
            0% { 
                transform: translateY(-200px) scale(0.85);
                opacity: 1;
            }
            30% { 
                transform: translateY(-150px) scale(0.85);
                opacity: 0.9;
            }
            70% { 
                opacity: 0.7;
            }
            100% { 
                transform: translateY(0) scale(0.85);
                opacity: 0;
            }
        }

        .letter-sliding-out {
            animation: letter-slide-out 1.2s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }
        .letter-expanding {
            animation: letter-expand-center 1s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
        }
        .letter-shrinking {
            animation: letter-shrink-back 1s cubic-bezier(0.55, 0.06, 0.68, 0.19) forwards;
        }
        .letter-sliding-in {
            animation: letter-slide-in 1.2s cubic-bezier(0.8, 0, 0.6, 1) forwards;
        }

        /* --- Letter Content Animation --- */
        .letter-part {
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.8s ease-out, transform 0.8s ease-out;
            /* เพิ่ม whitespace-pre-wrap เพื่อเคารพการขึ้นบรรทัดใหม่ */
            white-space: pre-wrap;
        }
        .letter-part.visible {
            opacity: 1;
            transform: translateY(0);
        }
        .letter-part.scroll-up {
            animation: scroll-up 0.8s ease-out forwards;
        }
        @keyframes scroll-up {
            0% {
                opacity: 1;
                transform: translateY(0);
            }
            100% {
                opacity: 0;
                transform: translateY(-30px);
            }
        }

        
        @media (max-width: 600px) { 
            
            /* * 1. ปรับ Keyframe ของจดหมายตอนขยาย
             * ให้เต็มหน้าจอมือถือ
             */
            @keyframes letter-expand-center {
                0% { 
                    transform: translateY(-200px) scale(0.85);
                    opacity: 1;
                }
                100% { 
                    /* --- นี่คือจุดที่แก้ --- */
                    transform: translate(-50%, -50%) scale(1.0); /* เปลี่ยน scale เป็น 1 */
                    left: 50%;
                    top: 50%;     /* จัดกลางจอ */
                    width: 95vw;  /* กว้าง 95% ของความกว้างจอ */
                    height: 80vh; /* สูง 80% ของความสูงจอ */
                    z-index: 10;
                    opacity: 1;
                }
            }

            /* * 2. ปรับ Keyframe ตอนหดกลับ
             * ให้เริ่มจากขนาดที่เต็มจอ (ตามที่แก้ด้านบน)
             */
            @keyframes letter-shrink-back {
                0% { 
                    /* --- นี่คือจุดที่แก้ --- */
                    transform: translate(-50%, -50%) scale(1.0);
                    left: 50%;
                    top: 50%;
                    width: 95vw;
                    height: 80vh;
                    z-index: 10;
                    opacity: 1;
                }
                100% { 
                    /* กลับไปที่ค่าเดิม (ซึ่งซ่อนในซอง) */
                    transform: translateY(-200px) scale(0.85);
                    left: 20px;
                    top: 15px;
                    width: 260px;
                    height: 180px;
                    z-index: 4;
                    opacity: 1;
                }
            }
        }

    </style>
</head>
<body>

    <div id="envelope-view" class="view text-center">
      <div class="sb-collage sb-collage--center" style="overflow: visible;">
        <div class="sb-tape sb-tape--top"></div>
        <p class="sb-label sb-script">a letter for you</p>

        <div class="sb-stickers" aria-hidden="true">
            <span class="sb-sticker" data-kind="heart"   data-x="16" data-y="18" data-size="42" data-rotate="-14" data-color="#EDB8C4"></span>
            <span class="sb-sticker" data-kind="star"    data-x="82" data-y="16" data-size="34" data-rotate="12"  data-color="#F2CD6B"></span>
            <span class="sb-sticker" data-kind="flower"  data-x="88" data-y="27" data-size="36" data-rotate="0"   data-color="#BFD1B5"></span>
            <span class="sb-sticker" data-kind="bow"     data-x="14" data-y="29" data-size="50" data-rotate="-10" data-color="#D9A0B0"></span>
            <span class="sb-sticker" data-kind="button"  data-x="8"  data-y="64" data-size="30" data-rotate="8"   data-color="#DCC3A5"></span>
            <span class="sb-sticker" data-kind="heart"   data-x="88" data-y="66" data-size="36" data-rotate="14"  data-color="#C9A27E"></span>
            <span class="sb-sticker" data-kind="star"    data-x="24" data-y="82" data-size="28" data-rotate="-18" data-color="#F2CD6B"></span>
            <span class="sb-sticker" data-kind="flower"  data-x="74" data-y="85" data-size="34" data-rotate="10"  data-color="#F2C6CF"></span>
            <span class="sb-sticker" data-kind="sparkle" data-x="40" data-y="14" data-size="14" data-color="#C9A27E"></span>
            <span class="sb-sticker" data-kind="sparkle" data-x="62" data-y="22" data-size="12" data-color="#C9A27E"></span>
            <span class="sb-sticker" data-kind="sparkle" data-x="5"  data-y="50" data-size="12" data-color="#C9A27E"></span>
            <span class="sb-sticker" data-kind="sparkle" data-x="95" data-y="50" data-size="12" data-color="#C9A27E"></span>
            <span class="sb-sticker" data-kind="sparkle" data-x="48" data-y="90" data-size="14" data-color="#C9A27E"></span>
        </div>

        <div class="envelope-wrapper" data-sb-origin>
            <div id="envelope" class="envelope" role="button" aria-label="แตะเพื่อเปิดจดหมาย">
                <div class="flap left-flap"></div>
                <div class="flap right-flap"></div>
                <div class="flap bottom-flap"></div>
                <div class="flap front-panel"></div>

                <div id="letter-inside" class="letter-inside">
                    <div class="sb-tape sb-tape--piece" style="top: 0;"></div>
                    <div class="text-center">
                        <h1 class="letter-title sb-script">happy birthday 🤎</h1>
                    </div>
                    <div class="text-left" id="letter-content">
                        </div>
                    <div class="text-center absolute bottom-5 left-0 right-0">
                        <button id="close-button" class="sb-btn sb-btn--fill">
                            ปิดจดหมาย
                        </button>
                    </div>
                </div>

                <div class="flap top-flap"></div>
                <div class="seal">🤎</div>
                <div class="sb-tape sb-tape--piece env-tape"></div>
            </div>
        </div>
        <p id="instruction" class="env-instruction sb-hand">
            ซองจดหมาย<small>แตะที่ซองเพื่อเปิด</small>
        </p>

        <div class="sb-tape sb-tape--bottom"></div>
      </div>
    </div>

    <script>
        // DOM Elements
        const envelope = document.getElementById('envelope');
        const instruction = document.getElementById('instruction');
        const letterInside = document.getElementById('letter-inside');
        const closeButton = document.getElementById('close-button');
        const letterContent = document.getElementById('letter-content');
        
        let isOpened = false;
        let isAnimating = false;
        let currentPart = 0;
        let letterParts = [];

        const fullLetterText = `สุขสันต์วันเกิดนะครับ 🤎

ขอให้ปีนี้มีเรื่องดี ๆ ให้ยิ้มได้เยอะ ๆ ได้ทำสิ่งที่ชอบ และมีเวลาพักในวันที่เหนื่อย ขอให้สิ่งที่ตั้งใจไว้ค่อย ๆ เป็นจริงนะครับ`;


        // === จุดที่ 2: แก้ไขฟังก์ชัน splitTextIntoParts ===
        // (ส่วนนี้ถูกต้องอยู่แล้ว ไม่ได้แก้ไข)
        function splitTextIntoParts(text, maxLength = 400) {
            const words = text.match(/\S+|\s+/g) || [];
            const parts = [];
            let currentText = '';

            for (const word of words) {
                if ((currentText + word).length > maxLength && currentText.length > 0) {
                    parts.push(currentText);
                    currentText = word;
                } else {
                    currentText += word;
                }
            }
            
            if (currentText) {
                parts.push(currentText);
            }
            
            // ถ้า text ว่างเปล่า, parts จะเป็น [], เราจะคืน [text] ([""])
            if (parts.length === 0) {
                return [text];
            }
            
            // คืน 'parts' เสมอ เพื่อให้ letterParts.length ถูกต้อง
            return parts;
        }

        // Function to display current letter part
        function displayLetterPart(partIndex) {
            if (partIndex >= letterParts.length) return;

            letterContent.innerHTML = '';

            // Add "To" text on the first part
            if (partIndex === 0) {
                const toElement = document.createElement('div');
                toElement.className = 'letter-part text-left mb-4';
                toElement.style.cssText = `
                    color: var(--heading-color);
                    font-family: 'Caveat', 'Mali', cursive;
                    font-size: 22px;
                    opacity: 0;
                    transform: translateY(20px);
                    transition: opacity 0.8s ease-out, transform 0.8s ease-out;
                `;
                toElement.textContent = 'ถึงคนพิเศษ';
                
                letterContent.appendChild(toElement);

                // Animate "to" text in first
                setTimeout(() => {
                    toElement.style.opacity = '1';
                    toElement.style.transform = 'translateY(0)';
                }, 200);
            }

            const partElement = document.createElement('p');
            partElement.className = 'letter-part text-sm leading-relaxed';
            partElement.style.color = 'var(--text-color)';
            partElement.textContent = letterParts[partIndex];
            
            letterContent.appendChild(partElement);

            // Add signature on the last part
            if (partIndex === letterParts.length - 1) {
                const signatureElement = document.createElement('div');
                signatureElement.className = 'letter-part text-right mt-4';
                signatureElement.style.cssText = `
                    color: var(--heading-color);
                    font-family: 'Caveat', 'Mali', cursive;
                    font-size: 22px;
                    opacity: 0;
                    transform: translateY(20px);
                    transition: opacity 0.8s ease-out, transform 0.8s ease-out;
                `;
                signatureElement.textContent = 'จาก...พี่โชกุน';
                
                letterContent.appendChild(signatureElement);

                // Animate signature in after main content
                setTimeout(() => {
                    signatureElement.style.opacity = '1';
                    signatureElement.style.transform = 'translateY(0)';
                }, 600);
            }
            
            // Trigger fade-in animation
            setTimeout(() => {
                partElement.classList.add('visible');
                // Update button text after content is shown
                updateButtonText();
            }, 100);
        }

        // === จุดที่ 3: แก้ไขฟังก์ชัน animateToNextPart ===
        // (ส่วนนี้ถูกต้องอยู่แล้ว ไม่ได้แก้ไข)
        function animateToNextPart() {
            if (currentPart >= letterParts.length - 1) return;

            // เลือก .letter-part ทั้งหมดที่แสดงอยู่
            const currentElements = letterContent.querySelectorAll('.letter-part');
            if (!currentElements || currentElements.length === 0) return;

            // ทำให้ทุกส่วนเลื่อนขึ้นพร้อมกัน
            currentElements.forEach(el => {
                el.classList.add('scroll-up');
            });
            
            setTimeout(() => {
                currentPart++;
                displayLetterPart(currentPart);
            }, 400); // ใช้ 400ms เพื่อให้การเปลี่ยนหน้ากระชับ
        }

        // Function to update button text based on current state
        function updateButtonText() {
            if (letterParts.length <= 1) {
                closeButton.textContent = 'ปิดจดหมาย';
            } else if (currentPart < letterParts.length - 1) {
                closeButton.textContent = 'หน้าต่อไป';
            } else {
                closeButton.textContent = 'ปิดจดหมาย';
            }
        }

        // Initialize letter parts when page loads
        function initializeLetter() {
            letterParts = splitTextIntoParts(fullLetterText);
            currentPart = 0;
        }

        // --- Event Listeners ---

        envelope.addEventListener('click', () => {
            if (isOpened || isAnimating) return;
            isAnimating = true;

            envelope.classList.add('open');
            envelope.parentElement.classList.add('is-open');
            instruction.style.opacity = '0';

            setTimeout(() => {
                document.querySelector('.top-flap').style.zIndex = '1';
                
                setTimeout(() => {
                    letterInside.classList.add('letter-sliding-out');
                    
                    setTimeout(() => {
                        letterInside.classList.remove('letter-sliding-out');
                        letterInside.classList.add('letter-expanding');
                        
                        setTimeout(() => {
                            isOpened = true;
                            isAnimating = false;
                            initializeLetter(); // เรียก initializeLetter ที่นี่อีกครั้งเพื่อให้แน่ใจว่าแบ่งหน้าถูกต้อง
                            displayLetterPart(0);
                            // updateButtonText(); // ถูกเรียกใน displayLetterPart แล้ว
                        }, 1000);
                    }, 1200);
                }, 100);
            }, 800);
        });

        closeButton.addEventListener('click', () => {
            if (!isOpened || isAnimating) return;

            // ตรวจสอบว่าควรกด "หน้าต่อไป" หรือ "ปิดจดหมาย"
            if (letterParts.length > 1 && currentPart < letterParts.length - 1) {
                animateToNextPart();
                // updateButtonText(); // ถูกเรียกใน animateToNextPart -> displayLetterPart แล้ว
            } else {
                // ถ้าเป็นหน้าสุดท้าย หรือมีหน้าเดียว ให้ปิดจดหมาย
                isAnimating = true;

                letterInside.classList.remove('letter-expanding');
                letterInside.classList.add('letter-shrinking');

                setTimeout(() => {
                    letterInside.classList.remove('letter-shrinking');
                    letterInside.classList.add('letter-sliding-in');

                    setTimeout(() => {
                        envelope.classList.remove('open');
                        document.querySelector('.top-flap').style.zIndex = '5';

                        setTimeout(() => {
                            // อวยพรเสร็จแล้ว ไปหน้าดอกไม้
                            document.body.style.transition = 'opacity 0.8s ease';
                            document.body.style.opacity = '0';
                            setTimeout(() => {
                                window.location.href = 'flowers.html';
                            }, 800);
                        }, 800);
                    }, 1200);
                }, 1000);
            }
        });

        // Initialize when page loads
        window.addEventListener('load', initializeLetter);
        // สติกเกอร์ค่อยๆ กระจายออกจากหลังซอง
        Scrapbook.init(document.getElementById('envelope-view'));
    </script>

</body>

</html>
