<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday!</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.7.77/Tone.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;700&family=Mali:wght@400;500;600&family=Caveat:wght@500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet" href="scrapbook.css">
    <script src="scrapbook.js"></script>
    <style>
        /* --- General Styles --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html {
            font-size: 16px;
        }
        body {
            overflow: hidden;
            background-color: var(--bg-color);
            font-family: 'Kanit', sans-serif;
        }

        /* --- Page & Transition Styles --- */
        .page-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: fixed;
            top: 0;
            left: 0;
            opacity: 1;
            transition: opacity 1.5s ease-in-out, visibility 1.5s;
            visibility: visible;
            padding: 1rem;
        }
        .page-container.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        #fadeOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-color);   /* เปลี่ยนหน้าแบบจางเป็นสีขาว */
            opacity: 0;
            z-index: 9999;
            pointer-events: none;
            transition: opacity 1.5s ease-in-out;
        }
        #fadeOverlay.visible {
            opacity: 1;
        }
        
        /* --- Gate & Countdown Page --- */
        #page-gate, #page-countdown {
            background-color: var(--bg-color);
        }
        .pin-input {
            width: 80px; height: 60px; text-align: center; font-size: 1.5rem;
            border: 2px solid var(--accent-color); border-radius: 0.5rem; margin: 0 0.25rem;
            background-color: var(--surface-color); color: var(--text-color);
        }
        .pin-input:focus {
            outline: none; border-color: var(--heading-color);
            box-shadow: 0 0 0 3px rgba(176, 137, 104, 0.3);
        }
        #hintModal { background-color: rgba(255, 255, 255, 0.75); }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-10px); }
            20%, 40%, 60%, 80% { transform: translateX(10px); }
        }
        .shake { animation: shake 0.5s ease-in-out; }

        /* --- Birthday Page --- */
        #page-birthday {
            background-color: var(--bg-color);
        }
        #page-birthday .container { 
            text-align: center; position: relative; z-index: 10; opacity: 0; 
            width: 100%; max-width: 900px;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            animation: fadeInUp 2s ease-out 0.5s forwards;
        }
        @keyframes fadeInUp {
            0% { opacity: 0; transform: translateY(40px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .happy-text, .birthday-text { color: var(--heading-color); line-height: 1; min-height: 1em; }
        .happy-text { font-size: 44px; }
        .birthday-text { font-size: 52px; margin-top: -4px; }
        .sb-card--cake { animation: none; padding: 26px 18px 20px; }
        .cake-container { position: relative; margin: 0 auto; opacity: 0; height: 180px; width: 100%; max-width: 240px; overflow: hidden; animation: scaleIn 1s ease-out 2s forwards; }
        @keyframes scaleIn { 0% { opacity: 0; transform: scale(0.8); } 100% { opacity: 1; transform: scale(1); } }
        .cake { width: 100%; position: absolute; bottom: 20px; }
        .bottom-layer, .top-layer, .middle-layer { height: 48px; width: 144px; position: relative; margin: auto; background-repeat: repeat; background-size: 100% 100%, 36px 60px; background-position: 18px 0; background-image: linear-gradient( transparent 30px, var(--surface-color) 30px, var(--surface-color) 36px, transparent 36px ), radial-gradient(circle at 18px 3px, var(--accent-color) 18px, var(--surface-color) 19px); }
        .middle-layer { transform: scale(0.85); top: 43px; animation: rise-1 2s forwards; }
        @keyframes rise-1 { 100% { top: 5px; } }
        .top-layer { transform: scale(0.7); top: 86px; animation: rise-2 2s 2s forwards; }
        @keyframes rise-2 { 100% { top: 16px; } }
        .candle { background: repeating-linear-gradient( 45deg, var(--accent-color) 0, var(--accent-color) 4px, var(--surface-color) 4px, var(--surface-color) 8px ); height: 27px; width: 9px; position: absolute; margin: auto; left: 0; right: 0; bottom: 0; animation: rise-3 1s 4s forwards; }
        @keyframes rise-3 { 100% { bottom: 121px; } }
        .candle:after { content: ""; position: absolute; height: 10px; width: 10px; background-color: var(--accent-color); border-radius: 0 50% 50% 50%; transform: scale(0) rotate(45deg); bottom: 30px; left: -0.5px; animation: flame 1.5s 5s forwards; transition: all 1.2s ease-out; }
        @keyframes flame { 100% { transform: scale(1) rotate(45deg); } }
        .candle.blown-out:after { transform: scale(0) rotate(45deg) !important; opacity: 0; }
        .candle:before { content: ""; position: absolute; width: 6px; height: 11px; background: var(--accent-color); border-radius: 50%; opacity: 0; filter: blur(3px); bottom: 34px; left: 50%; transform: translateX(-50%); }
        .candle.blown-out:before { animation: smokePuff 2.5s ease-out forwards; }
        @keyframes smokePuff { 0% { opacity: 0.6; transform: translateX(-50%) translateY(0) scale(0.5); } 100% { opacity: 0; transform: translateX(-50%) translateY(-30px) scale(1.5); } }
        .action-button { min-width: 150px; margin-top: 22px; position: relative; z-index: 6; opacity: 0; pointer-events: none; transform: translateY(16px); transition: opacity .8s ease, transform .8s ease; }
        .action-button.visible { opacity: 1; pointer-events: auto; transform: translateY(0); }
        .action-button.visible:active { transform: scale(.95) rotate(-1deg); }
        .wishes, .thai-message { color: var(--text-color); }
        .wishes { font-size: 22px; color: var(--accent-color); opacity: 0; margin-top: 4px; animation: fadeIn 1s ease-out 2.5s forwards; }
        .thai-message { font-size: 18px; line-height: 1.5; opacity: 0; min-height: 1.5em; animation: fadeIn 1s ease-out 3s forwards; }
        @keyframes fadeIn { 0% { opacity: 0; } 100% { opacity: 1; } }
        
        /* --- Countdown & Start Page Text Color --- */
        #page-countdown h1, #page-start h1 {
            color: var(--heading-color);
        }
        #page-countdown h1 { font-size: 24px; font-weight: 500; min-height: 1.5em; }

        /* --- Gate Page (scrapbook) --- */
        #page-gate h1 {
            color: var(--heading-color);
            font-size: 22px;
            font-weight: 500;
            line-height: 1.5;
            margin: 2px 0 18px;
        }
        #page-gate .sb-pin {
            width: 190px;
            height: 52px;
            font-size: 28px;          /* >= 16px กัน iPhone ซูมตอนแตะช่อง */
            letter-spacing: 0.55em;
            text-indent: 0.55em;
            text-align: center;
            color: var(--heading-color);
            background: transparent;
            border: none;
            border-bottom: 1.5px dashed var(--accent-color);
            border-radius: 0;
            outline: none;
        }
        #page-gate .sb-pin::placeholder { color: var(--accent-soft); }
        #page-gate .sb-pin:focus { border-bottom-style: solid; }
        #page-gate .sb-actions {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 22px;
        }
        
        /* --- Responsive Adjustments --- */
        @media (max-width: 480px) {
            .balloon-container { display: none; } 
        }

        @media (min-width: 768px) and (orientation: landscape), (min-width: 1024px) {
            #page-birthday .container {
                transform: scale(0.75); 
            }
        }
    </style>
</head>
<body>

    <div id="page-countdown" class="page-container hidden sb-page">
        <div class="sb-collage sb-collage--center">
            <div class="sb-tape sb-tape--top"></div>

        <div class="sb-collage sb-collage--center">

            <div class="sb-stickers" aria-hidden="true">
                <span class="sb-sticker" data-kind="heart"   data-x="14" data-y="7"  data-size="40" data-rotate="-12" data-color="#EDB8C4"></span>
                <span class="sb-sticker" data-kind="star"    data-x="84" data-y="8"  data-size="34" data-rotate="14"  data-color="#F2CD6B"></span>
                <span class="sb-sticker" data-kind="bow"     data-x="90" data-y="22" data-size="48" data-rotate="18"  data-color="#D9A0B0" data-front></span>
                <span class="sb-sticker" data-kind="flower"  data-x="7"  data-y="30" data-size="36" data-rotate="0"   data-color="#BFD1B5" data-front></span>
                <span class="sb-sticker" data-kind="button"  data-x="95" data-y="52" data-size="28" data-rotate="-8"  data-color="#DCC3A5"></span>
                <span class="sb-sticker" data-kind="heart"   data-x="5"  data-y="60" data-size="30" data-rotate="10"  data-color="#C9A27E"></span>
                <span class="sb-sticker" data-kind="star"    data-x="90" data-y="74" data-size="30" data-rotate="-16" data-color="#F2CD6B" data-front></span>
                <span class="sb-sticker" data-kind="flower"  data-x="12" data-y="91" data-size="34" data-rotate="12"  data-color="#F2C6CF"></span>
                <span class="sb-sticker" data-kind="button"  data-x="86" data-y="93" data-size="28" data-rotate="4"   data-color="#B9D3DB"></span>
                <span class="sb-sticker" data-kind="sparkle" data-x="42" data-y="5"  data-size="14" data-color="#C9A27E"></span>
                <span class="sb-sticker" data-kind="sparkle" data-x="64" data-y="7"  data-size="12" data-color="#C9A27E"></span>
                <span class="sb-sticker" data-kind="sparkle" data-x="4"  data-y="45" data-size="12" data-color="#C9A27E"></span>
                <span class="sb-sticker" data-kind="sparkle" data-x="96" data-y="38" data-size="12" data-color="#C9A27E"></span>
                <span class="sb-sticker" data-kind="sparkle" data-x="38" data-y="95" data-size="12" data-color="#C9A27E"></span>
                <span class="sb-sticker" data-kind="sparkle" data-x="62" data-y="94" data-size="14" data-color="#C9A27E"></span>
            </div>

            <div class="container">
                <div class="sb-card sb-card--cake" data-sb-origin>
                    <div class="sb-tape sb-tape--piece"></div>
                    <div class="birthday-wrapper">
                        <div class="happy-text sb-script"></div>
                        <div class="birthday-text sb-script"></div>
                    </div>
                    <div class="cake-container">
                        <div class="cake">
                          <div class="candle"></div>
                          <div class="top-layer"></div>
                          <div class="middle-layer"></div>

                        </div>
                    </div>
                    <div class="wishes sb-script"></div>
                    <div class="thai-message sb-hand"></div>
                </div>
                <button class="action-button sb-btn sb-btn--fill" id="actionButton"></button>
            </div>

            <div class="sb-tape sb-tape--bottom"></div>
        </div>
    </div>

    <div id="page-start" class="page-container hidden">
        <div class="text-center">
            <h1 class="text-4xl sm:text-5xl md:text-7xl font-bold mb-8">พร้อมไหม</h1>
            <button id="readyButton" class="theme-button font-bold py-3 px-8 sm:py-4 sm:px-10 rounded-full text-lg sm:text-xl md:text-2xl active:scale-95 transition-all duration-200 shadow-lg">พร้อม</button>
        </div>
    </div>

    <div id="page-gate" class="page-container sb-page">
        <div class="sb-collage">
            <div class="sb-tape sb-tape--top"></div>
            <p class="sb-label sb-script">happy birthday</p>

            <div class="sb-stickers" aria-hidden="true">
                <span class="sb-sticker" data-kind="star"    data-x="12" data-y="10" data-size="36" data-rotate="-12" data-color="#F2CD6B"></span>
                <span class="sb-sticker" data-kind="bow"     data-x="76" data-y="9"  data-size="50" data-rotate="10"  data-color="#D9A0B0"></span>
                <span class="sb-sticker" data-kind="heart"   data-x="88" data-y="18" data-size="44" data-rotate="14"  data-color="#EDB8C4" data-front></span>
                <span class="sb-sticker" data-kind="button"  data-x="93" data-y="48" data-size="30" data-rotate="-10" data-color="#DCC3A5"></span>
                <span class="sb-sticker" data-kind="flower"  data-x="9"  data-y="57" data-size="40" data-rotate="0"   data-color="#BFD1B5" data-front></span>
                <span class="sb-sticker" data-kind="star"    data-x="26" data-y="71" data-size="28" data-rotate="-18" data-color="#F2CD6B"></span>
                <span class="sb-sticker" data-kind="heart"   data-x="76" data-y="70" data-size="42" data-rotate="16"  data-color="#C9A27E"></span>
                <span class="sb-sticker" data-kind="flower"  data-x="50" data-y="80" data-size="36" data-rotate="10"  data-color="#F2C6CF"></span>
                <span class="sb-sticker" data-kind="button"  data-x="15" data-y="88" data-size="30" data-rotate="6"   data-color="#B9D3DB"></span>
                <span class="sb-sticker" data-kind="heart"   data-x="88" data-y="88" data-size="28" data-rotate="-6"  data-color="#F6D6DC"></span>
                <span class="sb-sticker" data-kind="sparkle" data-x="34" data-y="9"  data-size="14" data-color="#C9A27E"></span>
                <span class="sb-sticker" data-kind="sparkle" data-x="94" data-y="33" data-size="12" data-color="#C9A27E"></span>
                <span class="sb-sticker" data-kind="sparkle" data-x="5"  data-y="38" data-size="12" data-color="#C9A27E"></span>
                <span class="sb-sticker" data-kind="sparkle" data-x="56" data-y="66" data-size="14" data-color="#C9A27E"></span>
                <span class="sb-sticker" data-kind="sparkle" data-x="36" data-y="93" data-size="12" data-color="#C9A27E"></span>
                <span class="sb-sticker" data-kind="sparkle" data-x="66" data-y="91" data-size="14" data-color="#C9A27E"></span>

            <div class="sb-card" data-sb-origin>
                <div class="sb-tape sb-tape--piece"></div>

                    <input type="text" id="passwordInput" class="sb-pin sb-hand" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" aria-label="รหัสผ่าน 4 หลัก" placeholder="····">

                    <button id="hintButton" class="sb-btn">คำใบ้จ้าาา</button>

    <div id="hintModal" class="fixed inset-0 z-[10000] items-center justify-center hidden">
        <div class="sb-card" style="max-width: 280px; margin: 0 24px; transform: rotate(1.5deg); animation: none;">
            <div class="sb-tape sb-tape--piece"></div>
            <p id="hintText" class="sb-hand" style="font-size: 22px; color: var(--heading-color);"></p>
            <button id="closeModalButton" class="sb-btn" style="margin-top: 18px;">ปิด</button>
        </div>
    </div>


    <script>
        document.addEventListener('DOMContentLoaded', function() {
            
            // =================================================================
            // --- CONFIGURATION ---
            // =================================================================
            const theme = getComputedStyle(document.documentElement);
            const CONFIG = {
                correctPin: "2211",
                hintText: "อยู่ในกล่องไง",
                countdownDuration: 3, // seconds
                songDuration: 30, // seconds - play only first 30 seconds
                fadeOutDuration: 3000, // milliseconds
                messages: {
                    happy: "happy",
                    birthday: "birthday",
                    wish: "Make a wish and celebrate!",
                    thai: "มีความสุขมากๆนะครับ",
                    blowCandle: "เป่าเทียน",
                    goNext: "ไปต่อ"
                },
                fireworkColor: theme.getPropertyValue('--accent-color').trim(),
                // สีพลุ/คอนเฟตตี = สีเดียวกับสติกเกอร์ (พาสเทล)
                palette: ['#EDB8C4', '#F2CD6B', '#BFD1B5', '#C9A27E', '#B9D3DB', '#F2C6CF']
            };

            // =================================================================
            // --- PAGE & ELEMENT REFERENCES ---
            // =================================================================
            const pages = {
                countdown: document.getElementById('page-countdown'),
                birthday: document.getElementById('page-birthday'),
                start: document.getElementById('page-start'),
                gate: document.getElementById('page-gate')
            };
            const fadeOverlay = document.getElementById('fadeOverlay');
            const actionButton = document.getElementById('actionButton');
            const readyButton = document.getElementById('readyButton');
            const confirmButton = document.getElementById('confirmButton');
            const hintButton = document.getElementById('hintButton');
            const modal = document.getElementById('hintModal');
            const closeModalButton = document.getElementById('closeModalButton');
            const hintTextElement = document.getElementById('hintText');
            const countdownTextElement = document.getElementById('countdownText');
            const pinContainer = document.getElementById('pin-container');
            const passwordInput = document.getElementById('passwordInput');
            const fireworksCanvas = document.getElementById('fireworks-canvas');
            const ctx = fireworksCanvas.getContext('2d');

            // =================================================================
            // --- STATE MANAGEMENT ---
            // =================================================================
            let interactionState = 'blow_candle'; // 'blow_candle' or 'go_next'
            let countdownTimer = CONFIG.countdownDuration;
            let rockets = [];
            let particles = [];
            let confetti = [];
            let explosionHasStarted = false;
            let animationRunning = false;
            let musicFadeInterval = null;
            let musicStartTime = 0;
            let isAudioReady = false;
            let pinAccepted = false; // กันตรวจรหัสซ้ำ (พิมพ์ครบ 4 หลัก + กดยืนยันพร้อมกัน)

            // =================================================================
            // --- TONE.JS AUDIO SETUP ---
            // =================================================================
            
            // Create a reverb effect for a softer, more atmospheric sound
            const reverb = new Tone.Reverb({
                decay: 4,
                preDelay: 0.01,
                wet: 0.3
            }).toDestination();

            // Create a synthesizer with a softer, "cuter" tone
            const synth = new Tone.PolySynth(Tone.FMSynth, {
                harmonicity: 3.01,
                modulationIndex: 10,
                envelope: {
                    attack: 0.01,
                    decay: 0.1,
                    sustain: 0.2,
                    release: 1.5
                },
                modulationEnvelope: {
                    attack: 0.01,
                    decay: 0.5,
                    sustain: 0.1,
                    release: 1.5
                }
            }).connect(reverb);

            // Set volume to 50%
            synth.volume.value = -6; // -6dB is approximately 50% volume

            // Define the Happy Birthday melody
            const melodyNotes = [
                // "Happy birthday to you"
                { time: '0:0', note: 'D4', duration: '8n' },
                { time: '0:0.5', note: 'D4', duration: '8n' },
                { time: '0:1', note: 'E4', duration: '4n' },
                { time: '0:2', note: 'D4', duration: '4n' },
                { time: '1:0', note: 'G4', duration: '4n' },
                { time: '1:1', note: 'F#4', duration: '2n' },

                // "Happy birthday to you"
                { time: '2:0', note: 'D4', duration: '8n' },
                { time: '2:0.5', note: 'D4', duration: '8n' },
                { time: '2:1', note: 'E4', duration: '4n' },
                { time: '2:2', note: 'D4', duration: '4n' },
                { time: '3:0', note: 'A4', duration: '4n' },
                { time: '3:1', note: 'G4', duration: '2n' },

                // "Happy birthday dear..."
                { time: '4:0', note: 'D4', duration: '8n' },
                { time: '4:0.5', note: 'D4', duration: '8n' },
                { time: '4:1', note: 'D5', duration: '4n' },
                { time: '4:2', note: 'B4', duration: '4n' },
                { time: '5:0', note: 'G4', duration: '4n' },
                { time: '5:1', note: 'F#4', duration: '4n' },
                { time: '5:2', note: 'E4', duration: '2n' },

                // "Happy birthday to you"
                { time: '6:1', note: 'C5', duration: '8n' },
                { time: '6:1.5', note: 'C5', duration: '8n' },
                { time: '6:2', note: 'B4', duration: '4n' },
                { time: '7:0', note: 'G4', duration: '4n' },
                { time: '7:1', note: 'A4', duration: '4n' },
                { time: '7:2', note: 'G4', duration: '2n' },
            ];

            // Create a Tone.Part to schedule the notes
            const melodyPart = new Tone.Part((time, value) => {
                synth.triggerAttackRelease(value.note, value.duration, time);
            }, melodyNotes).start(0);
            melodyPart.loop = true;
            melodyPart.loopEnd = '8m';

            // Configure the transport
            Tone.Transport.bpm.value = 100;

            // =================================================================
            // --- AUDIO FUNCTIONS ---
            // =================================================================
            
            // ⭐️⭐️⭐️ [START OF CHANGE 2] ⭐️⭐️⭐️
            async function startBackgroundMusic() {
                try {
                    // เราไม่จำเป็นต้อง await Tone.start() ที่นี่อีกแล้ว
                    // เพราะเราทำไปแล้วตอนกดปุ่ม
                    // แต่ใส่ไว้เช็กเผื่อเฉยๆ (แบบไม่ await) ก็ได้ครับ
                    if (!isAudioReady) {
                        console.warn('Audio context not ready. Trying to start (may fail on iOS).');
                        // ไม่ต้อง await เพราะจะทำให้ค้างถ้า user ไม่ได้กด
                        // และการเรียกครั้งแรก (ใน click) คือครั้งที่สำคัญที่สุด
                        Tone.start().then(() => { isAudioReady = true; }); 
                    }
                    
                    // Set master volume to 50%
                    Tone.Destination.volume.value = -6; // -6dB is approximately 50% volume
                    
                    if (Tone.Transport.state !== 'started') {
                        Tone.Transport.start();
                        musicStartTime = Date.now();
                        console.log('Melody started at 50% volume');
                    }
                } catch (error) {
                    console.log('Audio setup failed:', error);
                }
            }
            // ⭐️⭐️⭐️ [END OF CHANGE 2] ⭐️⭐️⭐️
            
            function fadeOutMusic() {
                if (musicFadeInterval) {
                    clearInterval(musicFadeInterval);
                }
                
                const startVolume = Tone.Destination.volume.value;
                const fadeStep = Math.abs(startVolume + 60) / (CONFIG.fadeOutDuration / 50); // Fade from current to -60dB
                
                musicFadeInterval = setInterval(() => {
                    const currentVolume = Tone.Destination.volume.value;
                    const newVolume = Math.max(-60, currentVolume - fadeStep);
                    Tone.Destination.volume.value = newVolume;
                    
                    if (newVolume <= -60) {
                        stopBackgroundMusic();
                        clearInterval(musicFadeInterval);
                        musicFadeInterval = null;
                    }
                }, 50);
            }
            
            function stopBackgroundMusic() {
                if (musicFadeInterval) {
                    clearInterval(musicFadeInterval);
                    musicFadeInterval = null;
                }
                Tone.Transport.stop();
                Tone.Destination.volume.value = -6; // Reset to 50% volume for next time
                console.log('Melody stopped');
            }

            // =================================================================
            // --- EVENT LISTENERS ---
            // =================================================================
            
            actionButton.addEventListener('click', function() {
                if (interactionState === 'blow_candle') {
                    handleBlowCandle();
                } else if (interactionState === 'go_next') {
                    fadeOutMusic(); // Start fading out music in background
                    fadeOverlay.classList.add('visible');
                    setTimeout(() => { window.location.href = 'envelope.html'; }, 1500); // ไปหน้า envelope
                }
            });

            readyButton.addEventListener('click', () => transitionTo('gate'));
            
            confirmButton.addEventListener('click', handlePinConfirm);

            // ปลดล็อก Audio Context ตอนผู้ใช้กดยืนยันรหัส
            // เพื่อให้ iOS อนุญาตให้เล่นเสียงได้ (ต้องเรียกจาก user gesture)
            function unlockAudio() {
                if (isAudioReady) return;
                Tone.start().then(() => {
                    isAudioReady = true;
                }).catch((e) => {
                    console.error('Audio start failed', e);
                });
            }

            // แตะช่องรหัสครั้งแรก = ปลดล็อกเสียงไว้ก่อน (iPhone ต้องการการแตะจริง)
            passwordInput.addEventListener('click', unlockAudio);
            document.addEventListener('touchend', unlockAudio, { once: true });

            passwordInput.addEventListener('input', () => {
                const digits = passwordInput.value.replace(/[^0-9]/g, '').slice(0, 4);
                if (passwordInput.value !== digits) passwordInput.value = digits;
                // คีย์บอร์ดตัวเลขบน iPhone ไม่มีปุ่ม Enter → ครบ 4 หลักแล้วตรวจให้เลย
                if (digits.length === 4) setTimeout(handlePinConfirm, 250);
            });

            // Add Enter key support for password input
            passwordInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    handlePinConfirm();
                }
            });

            hintButton.addEventListener('click', () => { 
                hintTextElement.textContent = CONFIG.hintText;
                modal.classList.remove('hidden'); 
                modal.classList.add('flex'); 
            });
            closeModalButton.addEventListener('click', () => { modal.classList.add('hidden'); modal.classList.remove('flex'); });
            modal.addEventListener('click', (e) => { if (e.target === modal) { modal.classList.add('hidden'); modal.classList.remove('flex'); }});
            
            window.addEventListener('resize', debounceResize);

            // =================================================================
            // --- CORE FUNCTIONS ---
            // =================================================================

            function transitionTo(targetPageId) {
                fadeOverlay.classList.add('visible');
                setTimeout(() => {
                    Object.values(pages).forEach(page => page.classList.add('hidden'));
                    pages[targetPageId].classList.remove('hidden');
                    
                    if (targetPageId === 'birthday') {
                        startBirthdayPageAnimations();
                        startBackgroundMusic(); // Start Tone.js melody when entering birthday page
                    }
                    if (targetPageId === 'gate') {
                        passwordInput.value = '';
                        passwordInput.focus();
                    }
                    if (targetPageId === 'countdown') resetAndStartCountdown();

                    setTimeout(() => fadeOverlay.classList.remove('visible'), 100);
                }, 1500);
            }

            function handleBlowCandle() {
                explosionHasStarted = false; 
                document.querySelector('.candle').classList.add('blown-out'); 
                
                launchFireworkFromPosition(window.innerWidth * 0.2);
                launchFireworkFromPosition(window.innerWidth * 0.5);
                launchFireworkFromPosition(window.innerWidth * 0.8);
                
                // Start confetti after a short delay
                setTimeout(() => {
                    createConfetti();
                }, 500);
                
                setTimeout(() => {
                    const pos1 = 0.35;
                    const pos2 = 0.65;
                    launchFireworkFromPosition(window.innerWidth * pos1);
                    launchFireworkFromPosition(window.innerWidth * pos2);
                }, 1000);
                
                actionButton.classList.remove('visible');
                setTimeout(() => {
                    actionButton.textContent = CONFIG.messages.goNext;
                    actionButton.classList.add('visible');
                    interactionState = 'go_next';
                }, 3500);
            }

            function handlePinConfirm() {
                const enteredPin = passwordInput.value.trim();
                if (pinAccepted || enteredPin.length === 0) return;
                if (enteredPin === CONFIG.correctPin) {
                    pinAccepted = true;
                    unlockAudio();
                    passwordInput.blur();
                    transitionTo('countdown'); // รหัสถูก → นับถอยหลัง → หน้าเค้ก
                } else {
                    pinContainer.classList.add('shake');
                    passwordInput.value = '';
                    passwordInput.focus();
                    setTimeout(() => pinContainer.classList.remove('shake'), 500);
                }
            }

            function updateCountdown() {
                if (countdownTimer >= 0) {
                    countdownTextElement.textContent = countdownTimer > 0 ? `จะเริ่มใน ${countdownTimer} วินาที` : 'เริ่ม!';
                    countdownTimer--;
                    setTimeout(updateCountdown, 1100);
                } else {
                    transitionTo('birthday');
                }
            }
            
            function resetAndStartCountdown() {
                countdownTimer = CONFIG.countdownDuration;
                updateCountdown();
            }

            // =================================================================
            // --- ANIMATION & VISUALS ---
            // =================================================================

            function startBirthdayPageAnimations() {
                document.querySelector('.wishes').textContent = CONFIG.messages.wish;
                document.querySelector('.thai-message').textContent = CONFIG.messages.thai;

                // สติกเกอร์กระจายออกหลังหน้าจางเข้ามาแล้ว
                setTimeout(() => Scrapbook.init(pages.birthday), 900);
                
                setTimeout(() => {
                    const happyText = document.querySelector('.happy-text');
                    const birthdayText = document.querySelector('.birthday-text');
                    typeWriter(happyText, CONFIG.messages.happy, 150, () => {
                        typeWriter(birthdayText, CONFIG.messages.birthday, 150);
                    });
                }, 1000);

                setTimeout(() => {
                    actionButton.textContent = CONFIG.messages.blowCandle;
                    actionButton.classList.add('visible');
                }, 7000);
            }

            function typeWriter(element, text, speed, callback) {
                let i = 0;
                element.innerHTML = '';
                function type() {
                    if (i < text.length) {
                        element.innerHTML += text.charAt(i);
                        i++;
                        setTimeout(type, speed);
                    } else if (callback) callback();
                }
                type();
            }

            // --- Canvas Fireworks Section ---
            function resizeCanvas() {
                fireworksCanvas.width = window.innerWidth;
                fireworksCanvas.height = window.innerHeight;
            }

            class Rocket {
                constructor(x, y) {
                    this.x = x; 
                    this.y = window.innerHeight * 0.85; // Start at 15% from bottom
                    this.targetY = window.innerHeight * 0.3 + Math.random() * (window.innerHeight * 0.1);
                    this.speed = 2;
                }
                update() {
                    this.y -= this.speed;
                    return this.y <= this.targetY;
                }
                draw() {
                    ctx.globalAlpha = 1;
                    ctx.fillStyle = CONFIG.fireworkColor;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, 2, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            class Particle {
                constructor(x, y) {
                    this.x = x; this.y = y;
                    this.vx = (Math.random() - 0.5) * 2.5;
                    this.vy = (Math.random() - 0.5) * 2.5;
                    this.life = 80;
                    this.maxLife = 80;
                    this.size = 2;
                    this.gravity = 0.02;
                    this.friction = 0.98;
                    this.color = CONFIG.palette[Math.floor(Math.random() * CONFIG.palette.length)];
                }
                update() {
                    this.vx *= this.friction; this.vy *= this.friction;
                    this.vy += this.gravity;
                    this.x += this.vx; this.y += this.vy;
                    this.life--;
                }
                draw() {
                    ctx.globalAlpha = this.life / this.maxLife;
                    ctx.fillStyle = this.color;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            class Confetti {
                constructor() {
                    this.x = Math.random() * window.innerWidth;
                    this.y = -10;
                    this.vx = (Math.random() - 0.5) * 0.5;
                    this.vy = Math.random() * 0.3 + 0.2;
                    this.rotation = Math.random() * 360;
                    this.rotationSpeed = (Math.random() - 0.5) * 5;
                    this.size = Math.random() * 8 + 4;
                    this.color = CONFIG.palette[Math.floor(Math.random() * CONFIG.palette.length)];
                    this.life = 180;
                    this.gravity = 0.015;
                    this.friction = 0.995;
                }
                
                update() {
                    this.vy += this.gravity;
                    this.vx *= this.friction;
                    this.x += this.vx;
                    this.y += this.vy;
                    this.rotation += this.rotationSpeed;
                    this.life--;
                }
                
                draw() {
                    ctx.save();
                    ctx.translate(this.x, this.y);
                    ctx.rotate(this.rotation * Math.PI / 180);
                    ctx.fillStyle = this.color;
                    ctx.fillRect(-this.size/2, -this.size/2, this.size, this.size);
                    ctx.restore();
                }
            }

            function createConfetti() {
                // Create limited confetti particles to avoid lag
                for (let i = 0; i < 30; i++) {
                    setTimeout(() => {
                        confetti.push(new Confetti());
                    }, i * 50); // Stagger creation
                }
            }

            function createExplosion(x, y) {
                const particleCount = 50;
                for (let i = 0; i < particleCount; i++) {
                    particles.push(new Particle(x, y));
                }
            }

            function launchFireworkFromPosition(x) {
                rockets.push(new Rocket(x));
                if (!animationRunning) {
                    animationRunning = true;
                    animateFireworks();
                }
            }

            function animateFireworks() {
                if (rockets.length === 0 && particles.length === 0 && confetti.length === 0) {
                    animationRunning = false;
                    return;
                }

                ctx.clearRect(0, 0, fireworksCanvas.width, fireworksCanvas.height);
                
                // Update and draw rockets
                for (let i = rockets.length - 1; i >= 0; i--) {
                    const rocket = rockets[i];
                    rocket.draw();
                    if (rocket.update()) {
                        createExplosion(rocket.x, rocket.y);
                        rockets.splice(i, 1);
                        explosionHasStarted = true;
                    }
                }
                
                // Update and draw particles
                for (let i = particles.length - 1; i >= 0; i--) {
                    const particle = particles[i];
                    particle.update();
                    particle.draw();
                    if (particle.life <= 0) {
                        particles.splice(i, 1);
                    }
                }
                
                // Update and draw confetti
                for (let i = confetti.length - 1; i >= 0; i--) {
                    const piece = confetti[i];
                    piece.update();
                    piece.draw();
                    if (piece.y > window.innerHeight + 20 || piece.life <= 0) {
                        confetti.splice(i, 1);
                    }
                }
                
                requestAnimationFrame(animateFireworks);
            }

            // Debounced resize function
            let resizeTimeout;
            function debounceResize() {
                clearTimeout(resizeTimeout);
                resizeTimeout = setTimeout(resizeCanvas, 100);
            }

            // =================================================================
            // --- INITIALIZATION ---
            // =================================================================
            function init() {
                resizeCanvas();
                // เริ่มที่หน้าใส่รหัสทันที
                Object.values(pages).forEach(page => page.classList.add('hidden'));
                pages.gate.classList.remove('hidden');
                Scrapbook.init(pages.gate);
            }

            init();

        });
    </script>
</body>
</html>
